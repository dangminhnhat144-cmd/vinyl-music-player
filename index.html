<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vinyl Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* KHUNG BAO QUANH */
    .music-widget {
      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ĐĨA THAN */
    .record-container {
      position: relative;

      width: 20vw;
      height: 20vw;

      flex: 0 0 20vw;

      cursor: pointer;

      transition: transform 0.3s ease;
    }

    .record-container:hover {
      transform: scale(1.04);
    }

    /* BÓNG ĐĨA */
    .record-shadow {
      position: absolute;

      width: 100%;
      height: 100%;

      left: 0;
      top: 10px;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.16);

      filter: blur(18px);

      z-index: -1;
    }

    /* ẢNH ĐĨA */
    .record-image {
      display: block;

      width: 100%;
      height: 100%;

      border-radius: 50%;

      object-fit: cover;

      cursor: pointer;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* ĐANG PHÁT → XOAY */
    .record-container.playing .record-image {
      animation: recordSpin 4s linear infinite;
    }

    @keyframes recordSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>

  <div class="music-widget">

    <div class="record-container" id="recordToggle">

      <div class="record-shadow"></div>

      <img
        class="record-image"
        src="https://i.postimg.cc/g0V3Mkm6/Bandicoot-Design-Vinyl-PVC-Sleeve-Mockup.png?v=20261009"
        alt="Vinyl Record"
      >

    </div>

    <audio
      id="audioPlayer"
      src="https://www.dropbox.com/scl/fi/x5vcvnlf2woolz8eh8p28/Justin-Bieber-Nicki-Minaj-Beauty-And-A-Beat-Lyrics-J9abt3xpdDU.mp3?rlkey=1w58d2i5r933tzwr5zvyszoio&st=p1a322p4&raw=1">
    </audio>

  </div>

  <script>
    const record = document.getElementById("recordToggle");
    const audio = document.getElementById("audioPlayer");

    record.addEventListener("click", () => {

      if (audio.paused) {

        audio.play()
          .then(() => {
            record.classList.add("playing");
          })
          .catch(error => {
            console.error("Không thể phát nhạc:", error);
          });

      } else {

        audio.pause();
        record.classList.remove("playing");

      }

    });

    audio.addEventListener("ended", () => {
      record.classList.remove("playing");
    });
  </script>

</body>
</html>
