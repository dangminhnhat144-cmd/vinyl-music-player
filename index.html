<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    .music-widget {
      width: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .record-container {
      position: relative;
      width: 210px;
      height: 210px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .record-container:hover {
      transform: scale(1.04);
    }

    .record-shadow {
      position: absolute;
      width: 190px;
      height: 190px;
      left: 12px;
      top: 15px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.16);
      filter: blur(12px);
      z-index: -1;
    }

    .record-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    /* Đĩa xoay khi đang phát */
    .record-container.playing .record-image {
      animation: recordSpin 4s linear infinite;
    }

    @keyframes recordSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>

  <div class="music-widget">

    <div class="record-container" id="recordToggle">

      <div class="record-shadow"></div>

      <img
        class="record-image"
        src="https://i.postimg.cc/L8V5qqTy/Bandicoot-Design-Vinyl-PVC-Sleeve-Mockup.png"
        alt="Vinyl Record"
      >

    </div>

    <audio
      id="audioPlayer"
      src="https://www.dropbox.com/scl/fi/x5vcvnlf2woolz8eh8p28/Justin-Bieber-Nicki-Minaj-Beauty-And-A-Beat-Lyrics-J9abt3xpdDU.mp3?rlkey=1w58d2i5r933tzwr5zvyszoio&st=p1a322p4&raw=1">
    </audio>

  </div>

  <script>
    const record = document.getElementById("recordToggle");
    const audio = document.getElementById("audioPlayer");

    function toggleMusic() {

      if (audio.paused) {

        audio.play()
          .then(() => {
            record.classList.add("playing");
          })
          .catch((error) => {
            console.log("Audio cannot play:", error);
          });

      } else {

        audio.pause();
        record.classList.remove("playing");

      }
    }

    record.addEventListener("click", toggleMusic);

    audio.addEventListener("ended", () => {
      record.classList.remove("playing");
    });
  </script>

</body>
</html>
